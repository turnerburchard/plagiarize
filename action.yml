name: Plagiarize capture
description: Record a source-pinned CI job and upload a local replay manifest
inputs:
  preset:
    description: Runner preset; defaults to the observed GitHub Ubuntu image family
    required: false
  matrix:
    description: Original resolved matrix; pass toJSON(matrix) for matrix jobs
    required: false
    default: "{}"
outputs:
  artifact-name:
    description: Uploaded reproduction artifact
  manifest:
    description: Local manifest path on this runner
runs:
  using: node24
  main: action/dist/index.mjs
